<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockManager - Connexion</title>
</head>
<body>
    <h1>Ravi de vous revoir</h1>
    <p>Connectez-vous pour retrouver votre espace de gestion de stock.</p>

    <form action="#" method="post">
        <label for="identifiant">Identifiant</label>
        <input type="text" id="identifiant" name="identifiant" placeholder="Saisissez votre identifiant" required>

        <label for="mdp">Mot de passe</label>
        <input type="password" id="mdp" name="mdp" placeholder="Saisissez votre mot de passe" required>

        <a href="#">Mot de passe oublié ?</a>

        <button type="submit">Se connecter</button>
    </form>

    <p>Besoin d'aide pour vous connecter ? <a href="#">Contactez votre administrateur</a></p>
</body>
</html>
