
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrées des produits</title>
    <link rel="stylesheet" href="entrees.css">
</head>
<body>

    <div class="container">
        <h1>Entrées des produits</h1>
        <p>Enregistrer les nouveaux produits reçus dans le stock.</p>

        <div class="formulaire">
            <h2>Nouvelle entrée</h2>

            <form>
                <label>Nom du produit</label>
                <input type="text" placeholder="Ex : Ordinateur">

                <label>Catégorie</label>
                <input type="text" placeholder="Ex : Informatique">

                <label>Quantité reçue</label>
                <input type="number" placeholder="Entrez la quantité">

                <label>Fournisseur</label>
                <input type="text" placeholder="Nom du fournisseur">

                <label>Prix unitaire (€)</label>
                <input type="number" step="0.01" placeholder="Ex : 250">

                <label>Date d'entrée</label>
                <input type="date">

                <button type="submit">Enregistrer l'entrée</button>
            </form>
        </div>
    </div>

</body>
</html>
